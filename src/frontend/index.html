<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chubu Commons AI</title>
    <link rel="stylesheet" href="./style.css?v=20260724-komo-01">
    <link rel="stylesheet" href="./komo-stage.css?v=20260727-layout-04">
  </head>
  <body>
    <main class="screen" id="screen-password">
      <section class="screen-card">
        <p class="screen-label">中部大学 不言実行館</p>
        <h1 class="screen-title">Chubu Commons AI</h1>
        <p class="screen-text">パスワードを入力してください。</p>
        <form id="password-form" class="password-form">
          <input
            id="password-input"
            type="password"
            placeholder="パスワード"
            autocomplete="off"
            aria-label="パスワード"
          >
          <button type="submit" id="password-submit">確認して進む</button>
        </form>
        <p id="password-error" class="password-error" aria-live="polite"></p>
      </section>
    </main>

    <main class="screen hidden" id="screen-title">
      <section class="screen-card title-card">
        <div class="title-orb title-orb-a" aria-hidden="true"></div>
        <div class="title-orb title-orb-b" aria-hidden="true"></div>
        <p class="screen-label">中部大学 コモンズ案内AI</p>
        <h1 class="screen-title">Chubu Commons AI</h1>
        <p class="screen-text">中部大学、コモンズについてAIに聞いてみよう！</p>
        <div class="start-chat-cta">
          <p class="start-chat-hint">タッチしてね！</p>
          <button type="button" id="enter-chat" class="start-chat-button">チャットを始める</button>
        </div>
      </section>
    </main>

    <main class="app hidden" id="chat-app">
      <div class="chat-layout">
        <section class="chat-column">
          <header class="header">
            <div class="brand-lockup">
              <span class="brand-symbol" aria-hidden="true">K</span>
              <div>
                <p class="label">CHUBU COMMONS AI</p>
                <h1 class="chat-title">コモと話そう</h1>
              </div>
            </div>
            <div class="header-actions">
              <div class="status" id="status"></div>
              <button type="button" id="back-to-home" class="home-back-button">ホームへ戻る</button>
            </div>
          </header>

          <section class="chat-area" aria-label="会話">
            <div class="section-heading chat-heading">
              <span class="section-title">COMMENT</span>
              <span class="section-code">LIVE CHAT</span>
            </div>
            <div class="messages" id="messages" aria-live="polite">
              <div class="message-list" id="message-list">
                <article class="message bot">
                  <div class="message-name">コモ</div>
                  <div class="message-text">やっほー！コモだよ。質問を入力してね。</div>
                </article>
              </div>
            </div>
          </section>

          <section class="input-area" aria-label="質問入力">
            <div class="input-caption">
              <strong>ASK KOMO</strong>
              <span>聞きたいことを選ぶか、自由に入力してね</span>
            </div>
            <div class="quick-buttons" aria-label="よくある質問">
              <button type="button" class="quick-button">中部大学とは？</button>
              <button type="button" class="quick-button">コモンズとは？</button>
              <button type="button" class="quick-button">食堂について教えて</button>
            </div>

            <form class="form" id="form">
              <textarea
                id="question"
                name="question"
                rows="3"
                placeholder="質問を入力"
                autocomplete="off"
              ></textarea>
              <button type="submit" id="send">送信</button>
            </form>
          </section>
        </section>

        <aside class="guide-column" aria-label="コモ">
          <section class="avatar-card" id="avatar-card" data-emotion="neutral" aria-label="コモのアニメーションアバター">
            <div class="stage-heading">
              <p class="stage-eyebrow">CHUBU UNIVERSITY</p>
              <p class="stage-title">COMMONS<br>CONCIERGE</p>
            </div>
            <div class="avatar-stage" id="avatar-stage">
              <canvas id="avatar-canvas"></canvas>
              <div class="avatar-fallback" id="avatar-fallback" role="status">コモを準備中...</div>
            </div>
            <div class="avatar-meta">
              <p class="avatar-name">コモ</p>
              <p class="avatar-state" id="avatar-state" aria-live="polite">待機中</p>
            </div>
            <p class="stage-touch-note">TOUCH KOMO / REACTION</p>
          </section>
        </aside>
      </div>
      <div id="home-return-warning" class="home-return-warning hidden" aria-live="polite"></div>
    </main>

    <script src="./vendor/pixi.min.js"></script>
    <script src="./avatar-puppet.js?v=20260727-komo-13"></script>
    <script src="./app.js?v=20260727-komo-02"></script>
  </body>
</html>
